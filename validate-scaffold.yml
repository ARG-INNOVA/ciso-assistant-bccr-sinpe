name: Validate repository scaffold (no framework validation)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    name: Structure only - regulatory and import validation pending
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate repository scaffold
        run: python scripts/validate_scaffold.py
      - name: State validation scope
        run: echo '::warning::Scaffold checks only. Regulatory content, Excel/YAML schemas and CISO Assistant imports are NOT validated.'
