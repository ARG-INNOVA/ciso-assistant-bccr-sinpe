name: Validate repository and comprehensive library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install -r scripts/requirements-validation.txt
      - name: Check structure and library consistency
        run: python scripts/validate_scaffold.py
